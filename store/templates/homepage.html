{% extends "base.html" %}

{% block content %}
<style>
/* Product Sort Dropdown */

.product-sort {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
}

.product-sort label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brand-dark);
}

.product-sort select {
    min-width: 210px;
    padding: 12px 40px 12px 15px;
    border: 1px solid #ddd;
    border-radius: 0;
    background-color: #fff;
    color: var(--brand-dark);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 1px;
    cursor: pointer;
    outline: none;
    transition: 0.3s ease;
}

.product-sort select:hover,
.product-sort select:focus {
    border-color: var(--brand-dark);
}

@media (max-width: 576px) {

    .product-sort {
        justify-content: space-between;
    }

    .product-sort select {
        min-width: 180px;
    }

}
        /* Product Filter */
    .product-filter {
        margin-top: 20px;
    }

    .filter-label {
        display: block;
        font-family: 'Bodoni Moda', serif;
        font-size: 1.2rem;
        letter-spacing: 2px;
        color: var(--brand-dark);
        margin-bottom: 18px;
    }

    .filter-buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .filter-btn {
        display: inline-block;
        padding: 12px 22px;
        background: #ffffff;
        color: var(--brand-dark);
        border: 1px solid #ddd;
        text-decoration: none;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: all 0.3s ease;
    }

    .filter-btn:hover {
        background: var(--brand-slate);
        border-color: var(--brand-slate);
        color: #ffffff;
    }

    .filter-btn.active {
        background: var(--brand-dark);
        border-color: var(--brand-dark);
        color: #ffffff;
    }
    /* Hero Section matching the image colors */
    .hero-section {
        background-color: whitesmoke;
        padding: 60px 0;
        margin-bottom: 80px;
        position: relative;
        overflow: hidden;
    }

    .hero-subtitle {
        color: var(--brand-dark);
        font-weight: 400;
        letter-spacing: 6px;
        text-transform: uppercase;
        font-size: 0.75rem;
        display: block;
        margin-bottom: 20px;
        opacity: 0.8;
    }

    .hero-title {
        font-family: 'Bodoni Moda', serif;
        font-size: clamp(3.5rem, 10vw, 6rem);
        font-weight: 700;
        color: var(--brand-dark);
        line-height: 1.1;
        margin-bottom: 40px;
        text-transform: uppercase;
    }

    /* Square Shop Buttons */
    .btn-shop {
        display: inline-block;
        padding: 18px 50px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 3px;
        transition: 0.4s;
        border-radius: 0;
        margin: 10px;
        text-decoration: none;
    }

    .btn-bawal {
        background: #ffffff; 
        color: var(--brand-dark) !important;
        border: none;
    }

    .btn-shawl {
        background: #ffffff; 
        color: var(--brand-dark) !important;
        border: none;
    }

    .btn-shop:hover {
        background-color: var(--brand-slate);
        border-color: var(--brand-slate);
        color: white !important;
        transform: scale(1.05);
    }

    /* Elegant Section Headers */
    .section-label {
        font-family: 'Bodoni Moda', serif;
        font-size: 2.5rem;
        font-weight: 400;
        margin: 80px 0 50px;
        text-align: center;
        letter-spacing: 2px;
    }

    .section-label::after {
        content: '';
        display: block;
        width: 40px;
        height: 2px;
        background: var(--brand-lavender);
        margin: 15px auto;
    }

    .product-wrapper {
        background: transparent;
        padding: 0;
        border: none;
        transition: 0.4s ease;
    }

    .img-box {
        position: relative;
        aspect-ratio: 3/4;
        overflow: hidden;
        margin-bottom: 20px;
        background-color: #f8f9fa;
    }

    .product-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 1.2s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .product-wrapper:hover .product-img {
        transform: scale(1.08);
    }

    /* Square Bag Button */
    .bag-btn {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.9);
        padding: 15px;
        text-align: center;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--brand-dark);
        transform: translateY(100%);
        transition: 0.4s ease;
        border: none;
    }

    .product-wrapper:hover .bag-btn {
        transform: translateY(0);
    }

    .product-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 1px;
        color: var(--brand-dark);
        text-decoration: none;
        text-transform: uppercase;
        margin-bottom: 4px;
        display: block;
    }

    .price-tag {
        color: var(--brand-slate);
        font-weight: 400;
        font-size: 0.9rem;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }

    /* Product Card Rating Styling */
    .product-rating-badge {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 0.85rem;
        margin-top: 2px;
    }
    .star-gold {
        color: #f5a623;
    }
    .star-grey {
        color: #ddd;
    }
    .rating-score {
        font-weight: 700;
        color: #333;
        font-size: 0.8rem;
        margin-left: 3px;
    }
    .review-num {
        color: #888;
        font-size: 0.75rem;
    }

    /* Back to Top Button */
.back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 100px;
    height: 100px;
    border: none;
    background: var(--brand-dark);
    color: #ffffff;
    font-size: 3rem;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.3s ease;
    z-index: 999;
}

.back-to-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.back-to-top:hover {
    background: var(--brand-slate);
}

@media (max-width: 576px) {
    .back-to-top {
        bottom: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
    }
}

.product-sold {
    color: #888;
    font-size: 0.7rem;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
}
</style>

<section class="hero-section">
    <div class="container text-center">
        <span class="hero-subtitle">New Arrival 2026</span>
        <h1 class="hero-title">The Art of <br> <i>Modesty</i></h1>
        <div class="mt-4">
            <a href="#bawal" class="btn-shop btn-bawal">Shop Bawal</a>
            <a href="#shawl" class="btn-shop btn-shawl">Shop Shawl</a>
        </div>
    </div>
</section>

<div class="container mb-5">

    <!-- Sort Dropdown -->
    <div class="product-sort">
        <label for="sortProducts">
            Sort By
        </label>

        <select id="sortProducts">
            <option value="default">All Products</option>
            <option value="best_seller">Best Seller</option>
            <option value="top_rating">Top Rating</option>
            <option value="price_low">Price: Low to High</option>
            <option value="price_high">Price: High to Low</option>
        </select>
    </div>

    <!-- Products -->
    <div id="productContainer">
        {% include 'product_grid.html' %}
    </div>

</div>

<!-- Back to Top Button -->
<button id="backToTop" class="back-to-top" title="Back to top">
    ↑
</button>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const sortSelect = document.getElementById('sortProducts');
    const productContainer = document.getElementById('productContainer');
    const backToTop = document.getElementById('backToTop');

    if (!sortSelect || !productContainer) {
        return;
    }

    /* Product Sorting */
    sortSelect.addEventListener('change', function () {

        const sortValue = this.value;
        const scrollPosition = window.scrollY;

        productContainer.style.opacity = '0.5';
        productContainer.style.pointerEvents = 'none';

        fetch(`{% url 'filter_products' %}?sort=${sortValue}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to filter products');
                }

                return response.text();
            })
            .then(html => {

                productContainer.innerHTML = html;

                productContainer.style.opacity = '1';
                productContainer.style.pointerEvents = 'auto';

                // Keep user's current scroll position
                window.scrollTo(0, scrollPosition);
            })
            .catch(error => {

                console.error('Error:', error);

                productContainer.style.opacity = '1';
                productContainer.style.pointerEvents = 'auto';
            });
    });

    /* Back to Top */
    window.addEventListener('scroll', function () {

        if (window.scrollY > 400) {
            backToTop.classList.add('show');
        } else {
            backToTop.classList.remove('show');
        }

    });

    backToTop.addEventListener('click', function () {

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    });

});
</script>

{% endblock %}
